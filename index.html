<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog API Professional Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>🐶 Dog CEO Dashboard</h1>
            <p>Monitorizare în timp real a bazei de date cu rase de câini.</p>
        </header>

        <section class="main-content">
            <div class="image-card">
                <img id="dogImage" src="https://via.placeholder.com/400x300?text=Se+incarca..." alt="Imagine Caine">
            </div>

            <div class="action-area">
                <button id="loadBtn">Generează Câine Nou</button>
            </div>

            <div class="data-table">
                <table>
                    <thead>
                        <tr>
                            <th>Parametru</th>
                            <th>Valoare Proaspată</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Status Răspuns</td>
                            <td id="statusLabel">-</td>
                        </tr>
                        <tr>
                            <td>Rasă Detectată</td>
                            <td id="breedLabel">-</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
